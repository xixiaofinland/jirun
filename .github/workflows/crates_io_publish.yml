name: Publish to crates.io

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*' # Trigger only on version tags (e.g., v1.0.0)

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Publish to crates.io
    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Publish jirun-tool first (if it's a dependency of jirun)
      - name: Publish jirun-tool to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.JIRUN_CRATES_IO }}
        run: |
          cargo publish -p jirun-tool --no-verify
        continue-on-error: false

      # Wait a bit for crates.io to process the jirun-tool package
      - name: Wait for crates.io to update
        run: sleep 30

      # Publish jirun crate to crates.io
      - name: Publish jirun to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.JIRUN_CRATES_IO }}
        run: |
          # Ensure Cargo.lock is up-to-date
          cargo check
          # Publish jirun crate to crates.io
          cargo publish -p jirun --no-verify


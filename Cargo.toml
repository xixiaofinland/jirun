[package]
name = "jirun"
version = "0.23.0"
edition = "2021"
description = "A CLI tool that generates JIRA sub-task(s) with pre-populated field values"
license = "MIT"
authors = ["Your Name <your.email@example.com>"]
repository = "https://github.com/xixiaofinland/jirun"
homepage = "https://github.com/xixiaofinland/jirun"
keywords = ["jira", "cli", "subtask", "automation"]
categories = ["command-line-utilities"]

[[bin]]
name = "jirun"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.19.1"

